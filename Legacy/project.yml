# PhotoViewer Legacy（macOS 10.12 向け）
# Xcode 27 は 10.12 向けにビルドできないため、Xcode 16.4 で生成・ビルドする（Legacy/Scripts/build.sh）
name: PhotoViewerLegacy
options:
  bundleIdPrefix: com.geologycat
  deploymentTarget:
    macOS: "10.12"
  developmentLanguage: ja
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "10.12"
    # 10.12 が動く Mac はすべて Intel
    ARCHS: x86_64
    ONLY_ACTIVE_ARCH: NO
    # 通常版と共有するファイルの中で、10.12 で使えない部分を切り替える
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LEGACY"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: BT5MH5A8GY
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    # SwiftUI プレビュー用の部品（10.13 以降向け）をリンクしない
    ENABLE_PREVIEWS: NO
    ENABLE_DEBUG_DYLIB: NO

targets:
  PhotoViewerLegacy:
    type: application
    platform: macOS
    sources:
      - path: PhotoViewerLegacy
      # 通常版と共有する処理（UI に依存しない部分）
      - path: ../PhotoViewer/Models
      - path: ../PhotoViewer/Services/FolderScanner.swift
      - path: ../PhotoViewer/Services/PhotoFilter.swift
      - path: ../PhotoViewer/Services/RenameService.swift
      - path: ../PhotoViewer/Services/TIFFCompositeReader.swift
      - path: ../PhotoViewer/Services/MetadataReader.swift
      - path: ../PhotoViewer/Services/XMPSidecar.swift
      - path: ../PhotoViewer/Services/ThumbnailDiskCache.swift
      - path: ../PhotoViewer/Services/ThumbnailLoader.swift
      - path: ../PhotoViewer/Services/VideoSupport.swift
      - path: ../PhotoViewer/Services/DirectoryEventWatcher.swift
      - path: ../PhotoViewer/State/GridSettings.swift
      - path: ../PhotoViewer/Views/Grid/GridComponents.swift
      - path: ../PhotoViewer/Views/Inspector/PreviewGeometry.swift
      - path: ../PhotoViewer/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geologycat.PhotoViewerLegacy
        PRODUCT_NAME: PhotoViewer Legacy
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhotoViewer Legacy
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PhotoViewerLegacyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoViewerLegacyTests
    dependencies:
      - target: PhotoViewerLegacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geologycat.PhotoViewerLegacyTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoViewer Legacy.app/Contents/MacOS/PhotoViewer Legacy"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PhotoViewerLegacy:
    build:
      targets:
        PhotoViewerLegacy: all
        PhotoViewerLegacyTests: [test]
    test:
      targets:
        - PhotoViewerLegacyTests
