name: PhotoViewer
options:
  bundleIdPrefix: com.geologycat
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: ja
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 既定のアクター分離は nonisolated（UI 側は明示的に @MainActor を付ける）
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Xcode に登録した Apple ID（Personal Team）で署名する。署名が毎回同じになるので、アクセス許可が再ビルドのたびにリセットされない
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: BT5MH5A8GY
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

targets:
  PhotoViewer:
    type: application
    platform: macOS
    sources:
      - path: PhotoViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geologycat.PhotoViewer
        PRODUCT_NAME: PhotoViewer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhotoViewer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: デスクトップ内の写真を表示するために使用します。
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: 書類フォルダ内の写真を表示するために使用します。
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: ダウンロードフォルダ内の写真を表示するために使用します。
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: 外付けドライブやメモリーカード内の写真を表示するために使用します。
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: ネットワーク上の写真を表示するために使用します。
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PhotoViewerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoViewerTests
    dependencies:
      - target: PhotoViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geologycat.PhotoViewerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoViewer.app/Contents/MacOS/PhotoViewer"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PhotoViewer:
    build:
      targets:
        PhotoViewer: all
        PhotoViewerTests: [test]
    test:
      targets:
        - PhotoViewerTests
